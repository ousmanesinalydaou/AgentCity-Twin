repos:
  - repo: local
    hooks:
      - id: backend-lint
        name: Backend lint
        entry: python -m ruff check backend
        language: system
        pass_filenames: false
        types: [python]
      - id: frontend-lint
        name: Frontend lint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/src/

