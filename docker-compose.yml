name: agentcity-twin
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agentcity
      POSTGRES_USER: agentcity
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentcity-local}
    volumes:
      - city-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentcity -d agentcity"]
      interval: 4s
      timeout: 4s
      retries: 20
  migrate:
    image: agentcity-twin-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://agentcity:${DB_PASSWORD:-agentcity-local}@db:5432/agentcity
    command: ["alembic","-c","backend/alembic.ini","upgrade","head"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    image: agentcity-twin-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment: &runtime-env
      DATABASE_URL: postgresql+psycopg://agentcity:${DB_PASSWORD:-agentcity-local}@db:5432/agentcity
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3100}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL-prism-ml/bonsai-27b}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_CAPABILITIES: ${LM_STUDIO_CAPABILITIES:-structured,streaming,tools,vision}
      LM_STUDIO_EMBEDDING_MODEL: ${LM_STUDIO_EMBEDDING_MODEL-text-embedding-nomic-embed-text-v1.5}
      MODEL_LOCAL_ORIGINS: ${MODEL_LOCAL_ORIGINS:-http://host.docker.internal:1234}
      DEMO_LOCAL_PROVIDER: ${DEMO_LOCAL_PROVIDER-lm-studio,lm-studio-embedding}
      EXTERNAL_WORKER: "true"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel:4318}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health',timeout=3)"]
      interval: 6s
      timeout: 5s
      retries: 10
  worker:
    image: agentcity-twin-backend:local
    env_file:
      - path: .env
        required: false
    environment: *runtime-env
    command: ["python","-m","app.worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-m","app.worker","--health"]
      interval: 8s
      timeout: 5s
      retries: 8
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 6s
      timeout: 5s
      retries: 12
  otel:
    image: otel/opentelemetry-collector-contrib:0.140.1
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infrastructure/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:9464:9464"
volumes:
  city-database:


networks:
  default:
    ipam:
      config:
        - subnet: ${AGENTCITY_DOCKER_SUBNET:-10.196.213.0/24}
